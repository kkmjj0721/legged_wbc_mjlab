# 42 tasks, 14 geometry instances. These are independent of environment counts.
task_space:
  command_axes:
    vx:
      mode: magnitude_bins
      edges: [0.0, 0.4, 0.8, 1.2]
    wz:
      mode: magnitude_bins
      edges: [0.0, 0.5, 1.0]
    vy:
      mode: continuous
      range: [-0.3, 0.3]
  terrains:
    flat:
      levels:
        base: {}
    random_rough:
      levels:
        low: {height_max_m: 0.02}
        high: {height_max_m: 0.05}
    stairs_outward_up:
      levels:
        low: {step_height_m: 0.05}
        high: {step_height_m: 0.10}
    stairs_outward_down:
      levels:
        low: {step_height_m: 0.05}
        high: {step_height_m: 0.10}
geometry:
  replicas: 2
curriculum:
  method: lp
  temperature: 1.0
  uniform_mix: 0.0
