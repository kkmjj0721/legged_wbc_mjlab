model:
  xml: src/assets/robots/ri_4438/xmls/ri_4438.xml
  policy: logs/rsl_rl/ri_4438_ppo/2026-09-09_18-30-21/policy.onnx
  timestep: 0.005
  decimation: 4
  render: true

policy:
  observation_dim: 47
  action_dim: 12
  command_dim: 3
  joint_names:
    - FL_hip_joint
    - FL_thigh_joint
    - FL_calf_joint
    - FR_hip_joint
    - FR_thigh_joint
    - FR_calf_joint
    - RL_hip_joint
    - RL_thigh_joint
    - RL_calf_joint
    - RR_hip_joint
    - RR_thigh_joint
    - RR_calf_joint
  observation_terms:
    - base_ang_vel
    - projected_gravity
    - command
    - phase
    - joint_pos_rel
    - joint_vel
    - last_action

control:
  kp: 30.0
  kd: 0.6
  effort_limit: 10.0
  action_scale: [0.25, 0.5, 0.5, 0.25, 0.5, 0.5, 0.25, 0.5, 0.5, 0.25, 0.5, 0.5]
  phase_period: 0.6
  noise: false

pose:
  # All quaternions use MuJoCo's [w, x, y, z] convention.
  lying_pos: [0.0, 0.0, 0.085]
  lying_quat: [1.0, 0.0, 0.0, 0.0]
  lying_joint: [0.646, 0.943, -2.53, -0.646, 0.943, -2.53, 0.646, 0.943, -2.53, -0.646, 0.943, -2.53]
  standing_pos: [0.0, 0.0, 0.25]
  standing_quat: [1.0, 0.0, 0.0, 0.0]
  default_joint: [0.0, 0.9, -1.8, 0.0, 0.9, -1.8, 0.0, 0.9, -1.8, 0.0, 0.9, -1.8]
  stand_duration: 3.0

safety:
  fall_height: 0.055
  fall_tilt: 1.20

camera:
  follow: true
  track_body: base_link
  distance: 1.5
  azimuth: 90.0
  elevation: -20.0

input:
  backend: both
  deadzone: 0.08
  command_limit: [1.0, 1.0, 1.0]
  joystick_axes: [0, 1, 2]
  auto_stand: false
